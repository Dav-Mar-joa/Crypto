  <meta charset="UTF-8">
  <title>Wallet</title>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<body>
  <h1>Wallet</h1>

  <div class="btc-info">
    <a class="boutonGraphique" href="/index.html">Graphique</a>
    <a class="boutonGraphique" href="/signals.html">Signals</a>
  </div>
  <div class="summary">
    <p>💵 Total Portefeuille : <span id="usdInvested">...</span> €</p>
    <p>💰 Gain actuel : <span id="walletValue">...</span> €</p>
    <p>Value in BTC : <span id="btcValue"></span></p>
  </div>  

  <!-- === GRAPHIC ZONE === -->
  <h2>Évolution du Wallet (€)</h2>
  <canvas id="chart"></canvas>

  <script>
    // =============================
    //   CHARGEMENT WALLET ACTUEL
    // =============================
    async function loadWallet() {
      const res = await fetch("/btc-wallet");
      const data = await res.json();
      console.log("data : dans wallet : ",data);

      const gain = data.usdt;
      const btc = data.btc;
      const usdInvested = data.totalProfit;
      const amountInvested = data.amountInvested;

      document.getElementById("walletValue").textContent = gain.toFixed(2);
      document.getElementById("btcValue").textContent = btc.toFixed(6);
      document.getElementById("usdInvested").textContent = usdInvested.toFixed(2)+ " €";

      const history = data.history;
      console.log("HISTORY =", data.history);

      // labels = le temps
      const labels = history.map(h =>
        new Date(h.date).toLocaleTimeString("fr-FR", {
          hour: "2-digit",
          minute: "2-digit"
        })
      );

      // BUY → montant investi, sinon null
      const buyAmounts = history.map(h =>
        h.type === "BUY" ? h.amountUSDT : null
      );

      // SELL → montant récupéré, sinon null
      const sellAmounts = history.map(h =>
        h.type === "SELL" ? h.usdtReceived : null
      );

      const ctx = document.getElementById("chart").getContext("2d");

      // if (window.chart) {
      //   window.chart.destroy();
      // }

      if (window.chart?.destroy) {
        window.chart.destroy();
      }

      window.chart = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [
            {
              label: "BUY – Amount USDT",
              data: buyAmounts,
              borderWidth: 2,
              borderColor: "green",
              backgroundColor: "rgba(0,200,0,0.15)",
              tension: 0.25,
              spanGaps: true,

              pointRadius: buyAmounts.map(v => v ? 6 : 0),
              pointHoverRadius: buyAmounts.map(v => v ? 8 : 0),
              pointBackgroundColor: "green",
              pointBorderColor: "green",
              pointBorderWidth: 2
            },
            {
              label: "SELL – USDT Received",
              data: sellAmounts,
              borderWidth: 2,
              borderColor: "red",
              backgroundColor: "rgba(255,0,0,0.15)",
              tension: 0.25,
              spanGaps: true,
              pointRadius: sellAmounts.map(v => v ? 6 : 0),
              pointHoverRadius: sellAmounts.map(v => v ? 8 : 0),
              pointBackgroundColor: "red",
              pointBorderColor: "red",  
              pointBorderWidth: 2
            }
          ]
        },
        options: {
          responsive: true,
          interaction: {
            mode: "index",
            intersect: false
          },
          scales: {
            y: {
              beginAtZero: false,
              title: {
                display: true,
                text: "USDT"
              }
            },
            x: {
              title: {
                display: true,
                text: "Temps"
              }
            }
          }
        }
      });


    }

    loadWallet();
    setInterval(loadWallet, 60000);
