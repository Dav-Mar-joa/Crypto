<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/regression@2.0.1/dist/regression.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="/manifest.json"/>
  <title>Prix du Bitcoin</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <h1>Bitcoin (USD)</h1>

    <div class="buttons-wrapper">
      <!-- Variation / Price -->
      <label class="toggle-line">
        <input type="checkbox" id="check-variation" checked>
        <button id="button-toggle" class="button-toggle">Variation</button>
      </label>

      <!-- Volume / Market Cap -->
      <label class="toggle-line">
        <input type="checkbox" id="check-volume" >
        <button id="button-toggle2" class="button-toggle2">Volume</button>
      </label>

      

      <!-- Price lissé -->
      <label class="toggle-line">
        <input type="checkbox" id="check-smooth">
        Price smoothed
      </label>
      <label class="toggle-line">
        <div id="signal" class=""></div>
        
    </div>

    <div class="btc-info">
      <p id="prix" class="btc-prix">Chargement...</p>
      <p id="variation" class="btc-variation"></p>
      <canvas id="chart"></canvas> 
      <p id="maj" class="btc-maj"></p>
    </div>
  </div>

  <!-- Script principal -->
  <script src="script.js" type="module"></script>

  <script>
    // --- Enregistrement du Service Worker ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/service-worker.js')
          .then(function(registration) {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          })
          .catch(function(err) {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }

    // --- Demande de permission pour les notifications ---
    if ('Notification' in window && Notification.permission !== 'denied') {
      Notification.requestPermission().then(function(permission) {
        if (permission === "granted") {
          console.log('Permission pour les notifications accordée');
        } else {
          console.log('Permission pour les notifications refusée');
        }
      });
    }
  </script>
</body>
</html>
