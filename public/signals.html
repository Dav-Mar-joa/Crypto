<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Historique Trades BTC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Historique des trades BTC</h1>
  <p>Seuls les BUY et SELL sont affichés en temps réel.</p>

    <div class="btc-info">
      <a class = "boutonGraphique" href="/index.html">Graphique</a>
      <!-- <a class = "boutonGraphique" href="/trades.html">Trades</a> -->
      <a class = "boutonGraphique" href="/wallet.html">Wallet</a>
    </div>  

  <table id="signalsTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Price</th>
        <th>Last Buy</th>
        <th>Trend</th>
        <th>Signal</th>
        <th>Profit ($)</th>
        <th>Profit (%)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadSignals() {
      try {
        const res = await fetch("/btc-signals");
        const data = await res.json();

        const tbody = document.querySelector("#signalsTable tbody");
        tbody.innerHTML = "";

        // On ne garde que BUY et SELL
        data.forEach(s => {
          if (s.signal === "BUY" || s.signal === "SELL") {
            const tr = document.createElement("tr");

            const trendClass =
              s.trend === "up" ? "rise" :
              s.trend === "down" ? "fall" : "";

            const signalClass =
              s.signal === "BUY" ? "buy" :
              s.signal === "SELL" ? "sell" : "";

            tr.innerHTML = `
              <td>${new Date(s.date).toLocaleString("fr-FR", {
                day: "2-digit",
                month: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
              })}</td>
              <td>${s.price?.toFixed(2) ?? "-"}</td>
              <td>${s.lastBuy?.toFixed(2) ?? "-"}</td>
              <td class="${trendClass}">${s.trend}</td>
              <td class="${signalClass}">${s.signal}</td>
              <td>${s.profit != null ? s.profit.toFixed(2) : "-"}</td>
              <td>${s.variationProfit != null ? s.variationProfit.toFixed(2) + "%" : "-"}</td>
            `;
            tbody.appendChild(tr);
          }
        });
      } catch (err) {
        console.error("Erreur chargement signaux :", err);
      }
    }

    loadSignals();
    setInterval(loadSignals, 60000); // rafraîchissement toutes les 60 secondes
  </script>

</body>
</html>
